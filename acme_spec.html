<h1>Acme API v2 Specification</h1>
<p>The API exposes three endpoints: <code>/orders</code>, <code>/users</code>,
and <code>/export</code>. Authentication is via Bearer token passed in the
<code>Authorization</code> header.</p>
<p>Rate limits: 100 requests per minute per token. All responses are JSON.</p>
